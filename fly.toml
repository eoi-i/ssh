app = "nahid-linux-terminal"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2222"
  SSH_USER = "terminal"

[[services]]
  protocol = "tcp"
  internal_port = 2222
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 2222
    handlers = []

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
