app = 'ssh-8zjrsa'
primary_region = 'fra'

[build]
[env]
  HOST = '0.0.0.0'
  PORT = '2222'

[http_service]
  internal_port = 2222
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
